name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  typescript:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: extension

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: extension

  schema:
    name: Schema codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate
        run: node scripts/generate-schema.js

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are out of date — run 'node scripts/generate-schema.js'"
            exit 1
          fi
